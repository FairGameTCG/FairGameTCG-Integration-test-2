<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Card Grader - Fair Game TCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Use the same pink/gold theme as the main site */
    :root {
      --pink:       #B5547A;
      --pink-mid:   #D4789A;
      --pink-light: #FCE4EC;
      --peach:      #F9A86C;
      --peach-dark: #E8864A;
      --bg:         #FFF8F6;
      --text:       #2D1A22;
      --muted:      #7A5C68;
      --white:      #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(181,84,122,0.96);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; height: 64px;
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; color: var(--white);
      letter-spacing: 2px; text-decoration: none;
    }
    .nav-logo span { color: var(--peach); }
    .nav-back {
      color: rgba(255,255,255,0.85);
      text-decoration: none; font-size: 0.9rem; font-weight: 500;
    }
    .nav-back:hover { color: var(--peach); }
    .grader-header {
      background: linear-gradient(135deg, #C4607F 0%, #E08FAA 50%, #F9C4A8 100%);
      padding: 3rem 5% 2rem; color: var(--white); text-align: center;
    }
    .grader-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 2px; margin-bottom: 0.5rem;
    }
    .grader-main {
      max-width: 600px; margin: 2rem auto; padding: 0 1rem;
    }
    .version-selector {
      display: flex; gap: 8px; margin-bottom: 1.5rem;
    }
    .version-btn {
      flex: 1; padding: 10px;
      border: 2px solid rgba(181,84,122,0.2);
      background: var(--white);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .version-btn.active {
      border-color: var(--peach);
      color: var(--pink);
      background: var(--pink-light);
    }
    .drop-zone {
      border: 2px dashed rgba(181,84,122,0.2);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      background: var(--white);
      transition: 0.2s;
      margin-bottom: 1rem;
    }
    .drop-zone:hover { border-color: var(--peach); background: var(--pink-light); }
    .drop-zone input { display: none; }
    .btn-primary {
      background: var(--pink);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--pink-mid); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #results {
      display: none;
      margin-top: 1.5rem;
      background: var(--white);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(181,84,122,0.1);
    }
    #results img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .grade-display {
      text-align: center;
      margin: 1rem 0;
    }
    .grade-display .score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: var(--pink);
    }
    .breakdown { margin-top: 1rem; }
    .breakdown-row {
      display: flex; justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(181,84,122,0.1);
    }
    .error-box {
      display: none;
      background: rgba(230,57,70,0.1);
      color: #c0392b;
      padding: 12px;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--pink-light);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      background: var(--pink);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 2rem 5%;
      font-size: 0.85rem;
      margin-top: 3rem;
    }
    footer a { color: var(--peach); text-decoration: none; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Fair Game <span>TCG</span></a>
  <a href="/" class="nav-back">← Back to Home</a>
</nav>

<div class="grader-header">
  <h1>Card Grader</h1>
  <p style="opacity:0.85;">Upload a clear photo for AI-powered grading</p>
</div>

<div class="grader-main">
  <!-- Version Selector -->
  <div class="version-selector">
    <button class="version-btn active" data-version="v5" onclick="switchVersion('v5')">
      ⚡ v5.1 (New)
    </button>
    <button class="version-btn" data-version="v4" onclick="switchVersion('v4')">
      📷 v4 (Classic)
    </button>
  </div>

  <!-- Upload Area -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)" />
    <div id="uploadPrompt">
      <div style="font-size:2.5rem;margin-bottom:0.5rem;">📷</div>
      <div style="font-weight:600;">Tap to upload or take a photo</div>
      <div style="font-size:0.85rem;color:var(--muted);">Card on dark background, shoot straight down</div>
    </div>
    <div id="fileInfo" style="display:none;">
      <div style="font-size:1.5rem;">✅</div>
      <div id="fileName" style="font-weight:600;"></div>
    </div>
  </div>

  <button class="btn-primary" id="gradeBtn" disabled onclick="gradeCard()">
    🔍 Grade Card
  </button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Analyzing your card...</p>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="results">
    <img id="resultImage" src="" alt="Annotated card" />
    <div class="grade-display">
      <div class="score" id="gradeScore">--</div>
      <div id="gradeLabel" style="color:var(--muted);">Estimated Grade</div>
      <div id="gradeBand" style="font-size:0.85rem;color:var(--muted);margin-top:0.25rem;"></div>
    </div>
    <div class="breakdown" id="breakdown"></div>
    <div id="recommendation" style="margin-top:1rem;padding:1rem;background:var(--pink-light);border-radius:8px;"></div>
  </div>
</div>

<footer>
  <p><a href="/">← Back to Fair Game TCG</a> · Calgary, Alberta</p>
</footer>

<script>
  let currentVersion = 'v5';
  let selectedFile = null;

  function switchVersion(version) {
    currentVersion = version;
    document.querySelectorAll('.version-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.version === version);
    });
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    selectedFile = file;
    document.getElementById('uploadPrompt').style.display = 'none';
    document.getElementById('fileInfo').style.display = 'block';
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('gradeBtn').disabled = false;
    document.getElementById('results').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';
  }

  async function gradeCard() {
    if (!selectedFile) return;

    const btn = document.getElementById('gradeBtn');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const errorBox = document.getElementById('errorBox');

    btn.disabled = true;
    loading.style.display = 'block';
    results.style.display = 'none';
    errorBox.style.display = 'none';

    const formData = new FormData();
    formData.append('image', selectedFile);
    formData.append('mode', 'auto');  // Both v5 and v4 use auto mode from the server

    try {
      const response = await fetch('/grade', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.error || 'Analysis failed');
      }

      // Display results (works for both v4 and v5.1 response formats)
      displayResults(data);
    } catch (error) {
      errorBox.textContent = '⚠ ' + error.message;
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }

  function displayResults(data) {
    const results = document.getElementById('results');
    results.style.display = 'block';

    // Annotated image
    document.getElementById('resultImage').src = 'data:image/jpeg;base64,' + data.annotated_image;

    // Grade
    document.getElementById('gradeScore').textContent = data.overall_score + '/100';
    document.getElementById('gradeLabel').textContent = data.estimated_grade;
    document.getElementById('gradeBand').textContent = data.grade_band;

    // Breakdown
    const breakdown = document.getElementById('breakdown');
    let html = '';
    
    if (data.centering) {
      html += `<div class="breakdown-row">
        <span>📐 Centering</span>
        <strong>${data.centering.score}/${data.centering.max_score || 25} (${data.centering.grade})</strong>
      </div>`;
    }
    if (data.edges) {
      html += `<div class="breakdown-row">
        <span>📏 Edges</span>
        <strong>${data.edges.score}/${data.edges.max_score || 15}</strong>
      </div>`;
    }
    if (data.corners) {
      html += `<div class="breakdown-row">
        <span>◻ Corners</span>
        <strong>${data.corners.score}/${data.corners.max_score || 20}</strong>
      </div>`;
    }
    if (data.surface) {
      html += `<div class="breakdown-row">
        <span>✨ Surface</span>
        <strong>${data.surface.score}/${data.surface.max_score || 30} (${data.surface.grade})</strong>
      </div>`;
    }

    breakdown.innerHTML = html;

    // Recommendation
    const rec = document.getElementById('recommendation');
    rec.innerHTML = `
      <strong>📬 Recommendation:</strong> ${data.recommendation}<br>
      <small style="color:var(--muted);">${data.recommendation_reason}</small>
    `;

    // Scroll to results
    results.scrollIntoView({ behavior: 'smooth' });
  }
</script>

</body>
</html>
